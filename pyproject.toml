[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alvocas9"
version = "0.1.0"
description = "Pipeline in silico educacional para triagem inicial de potenciais sitios-alvo CRISPR-Cas9 em FASTA."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "AlvoCas9 contributors" }
]
dependencies = [
  "matplotlib>=3.7"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0"
]

[project.scripts]
alvocas9 = "alvocas9.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alvocas9 = ["reporting/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
